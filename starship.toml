"$schema" = 'https://starship.rs/config-schema.json'

format = "$os$directory$git_branch$git_status$time\n$character"
add_newline = false

palette = "quiet"

[palettes.quiet]
text = "#4b5563"
muted = "#7c8490"
accent = "#668b78"
warning = "#b7791f"
error = "#c45b55"

[os]
disabled = false
style = "fg:muted"

[os.symbols]
Macos = " "

[directory]
style = "fg:text"
format = "[$path]($style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "fg:accent"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:warning"
format = "([$all_status$ahead_behind]($style) )"

[time]
disabled = false
time_format = "%R"
style = "fg:muted"
format = "[· $time]($style) "

[character]
success_symbol = "[❯](fg:accent)"
error_symbol = "[❯](fg:error)"
vimcmd_symbol = "[❮](fg:accent)"
